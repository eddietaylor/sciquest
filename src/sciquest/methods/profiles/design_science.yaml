id: design_science
display_name: Design science
plain_language_label: Build and evaluate an artifact
description: Create an artifact, evaluate its utility, and iterate against design
  requirements.
best_for:
- Tools, systems, prototypes, algorithms
bad_for:
- Claims with no artifact or use context
phase_affinities:
- experiment_design
- evidence_evaluation
hypothesis_generation_rules:
- Specify the artifact, intended users, context and a measurable improvement over
  an explicit baseline.
experiment_design_rules:
- Evaluate the artifact against registered requirements, realistic tasks, baselines
  and resource budgets.
evidence_evaluation_rules:
- Assess utility, constraint compliance, failure cases and whether gains transfer
  beyond the design examples.
validation_rules:
- Separate artifact usefulness from claims about a causal mechanism or universal truth.
journal_sections:
- Artifact and user requirements
- Baseline comparison and constraints
- Design revisions and transfer limits
scoring_transform: method_lens_metadata_only_v1
next_step_policy:
- Revise the artifact to address the most consequential unmet requirement, then evaluate
  on fresh tasks.
failure_modes:
- Method shopping after results are known
- Overclaiming beyond the method lens
incompatible_or_tense_with: []
recommended_pairings:
- standard_empirical
prompt_addendum: Create an artifact, evaluate its utility, and iterate against design
  requirements.
profile_version: 1.1.0
