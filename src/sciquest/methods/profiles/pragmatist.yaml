id: pragmatist
display_name: Pragmatist inquiry
plain_language_label: Optimize inquiry for useful action
description: Judge inquiry by consequences for useful action while separating utility
  from truth claims.
best_for:
- Decision support
- Action-oriented research
bad_for:
- Replacing validity with convenience
phase_affinities:
- problem_framing
- experiment_design
- evidence_evaluation
- long_term_tracking
hypothesis_generation_rules:
- State the practical problem, affected stakeholders, proposed action and consequences
  that would count as improvement.
experiment_design_rules:
- Compare action policies using explicit objectives, baselines, uncertainty, resource
  costs and constraints.
evidence_evaluation_rules:
- Evaluate expected consequences and constraint violations separately; useful action
  does not establish that an explanation is true.
validation_rules:
- Preregister the utility objective and constraints; report harms and transfer limits
  alongside benefits.
journal_sections:
- Practical objective and stakeholders
- Decision value and constraints
- Consequences, uncertainty and limits
scoring_transform: method_lens_metadata_only_v1
next_step_policy:
- Choose a useful next inquiry or stop using expected consequences and information
  value, while preserving evidence standards.
failure_modes:
- Method shopping after results are known
- Overclaiming beyond the method lens
incompatible_or_tense_with: []
recommended_pairings:
- standard_empirical
prompt_addendum: Judge inquiry by consequences for useful action while separating
  utility from truth claims.
profile_version: 1.1.0
