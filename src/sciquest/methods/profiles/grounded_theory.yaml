id: grounded_theory
display_name: Grounded theory
plain_language_label: Build theory from qualitative observations
description: Build concepts and theory from coded observations while documenting saturation
  and memoing.
best_for:
- Qualitative data
- Field notes
- Open coding
bad_for:
- Immediate confirmatory statistical claims
phase_affinities:
- hypothesis_generation
- evidence_evaluation
hypothesis_generation_rules:
- Develop tentative concepts through documented coding, constant comparison and analytic
  memos; do not force all observations into the initial hypothesis.
experiment_design_rules:
- Use theoretical sampling to seek contrasting cases and negative cases; preserve
  the coding trail and revision rationale.
evidence_evaluation_rules:
- Inspect grounding in observations, negative cases, coding consistency and the stated
  basis for theoretical saturation.
validation_rules:
- Treat categories as provisional; a numeric prediction score does not validate a
  qualitative theory.
- The current managed CSV evaluator does not implement qualitative coding or independently
  verify saturation.
journal_sections:
- Coding decisions and analytic memos
- Negative cases and theoretical sampling
- Saturation rationale and limits
scoring_transform: method_lens_metadata_only_v1
next_step_policy:
- Collect or inspect cases that could revise an emerging category; stop only with
  an explicit scope and saturation argument.
failure_modes:
- Method shopping after results are known
- Overclaiming beyond the method lens
incompatible_or_tense_with: []
recommended_pairings:
- standard_empirical
prompt_addendum: Build concepts and theory from coded observations while documenting
  saturation and memoing.
profile_version: 1.1.0
