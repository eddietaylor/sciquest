id: popperian_falsificationist
display_name: Popperian falsificationist testing
plain_language_label: Try to disprove my hypothesis
description: Prefer risky predictions and diagnostic attempts at refutation while
  examining auxiliary assumptions and measurement.
best_for:
- Narrow hypotheses
- Integrity-focused stress tests
bad_for:
- Early exploration before hypotheses are precise
phase_affinities:
- stress_testing
- experiment_design
hypothesis_generation_rules:
- Make risky predictions that could be wrong.
experiment_design_rules:
- Design tests sensitive to specified alternatives; preregister risky predictions
  and checks of measurement and auxiliary assumptions.
evidence_evaluation_rules:
- A failed risky prediction puts the hypothesis-plus-auxiliaries under pressure; a
  surviving test does not verify the theory.
validation_rules:
- Specify falsification criteria before execution.
journal_sections:
- Risky predictions
- Falsification criteria
- Severe test assessment
scoring_transform: method_lens_metadata_only_v1
next_step_policy:
- Review failed predictions together with measurement and auxiliaries before implementing
  the registered reject, revise or replicate response.
failure_modes:
- Method shopping after results are known
- Overclaiming beyond the method lens
incompatible_or_tense_with: []
recommended_pairings:
- standard_empirical
prompt_addendum: Prefer risky predictions and severe tests; do not rescue failures
  post hoc.
profile_version: 1.1.0
