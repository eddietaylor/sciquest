    "support": {
      "type": "object",
      "properties": {
        "verdict": {
          "type": "string",
          "enum": [
            "supported",
            "assumption_dependent",
            "unsupported",
            "not_applicable",
            "adjudication_needed"
          ]
        },
        "basis_modes": {
          "type": "array",
          "items": {
            "type": "string",
            "enum": [
              "empirical",
              "conditional",
              "operational"
            ]
          }
        },
        "actor_basis_refs": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/actor_ref"
          }
        },
        "assumptions": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "rationale": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "verdict",
        "basis_modes",
        "actor_basis_refs",
        "assumptions",
        "rationale"
      ],
      "additionalProperties": false
    },
    "materiality": {
      "type": "object",
      "properties": {
        "judgment": {
          "type": "string",
          "enum": [
            "material",
            "ancillary",
            "not_applicable",
            "adjudication_needed"
          ]
        },
        "endpoint": {
          "type": "string",
          "enum": [
            "scientific_conclusion",
            "predictor_fidelity",
            "code_computation",
            "operational_delivery"
          ]
        },
        "dependent_target_ids": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "rationale": {
          "type": "string",
          "minLength": 1
        },
        "dependency_refs": {
          "type": "array",
          "items": {
            "type": "object",
            "properties": {
              "source_id": {
                "$ref": "#/$defs/id"
              },
              "span": {
                "$ref": "#/$defs/span"
              },
              "endpoint": {
                "type": "string",
                "enum": [
                  "scientific_conclusion",
                  "predictor_fidelity",
                  "code_computation",
                  "operational_delivery"
                ]
              }
            },
            "required": [
              "source_id",
              "span",
              "endpoint"
            ],
            "additionalProperties": false
          }
