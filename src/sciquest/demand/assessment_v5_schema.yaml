        }
      },
      "required": [
        "document_type",
        "public_packet_hash",
        "public_packet",
        "private_sources"
      ],
      "additionalProperties": false
    },
    "actor_ref": {
      "type": "object",
      "properties": {
        "source_id": {
          "type": "string",
          "minLength": 1
        },
        "purpose": {
          "type": "string",
          "enum": [
            "measurement",
            "execution_result",
            "authored_premise",
            "static_program",
            "provided_contract",
            "prior_operational_fact"
          ]
        }
      },
      "required": [
        "source_id",
        "purpose"
