{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "Scientific assessment v5 data contract",
  "description": "Machine-checkable provenance and stage shapes; semantic judgments and expert identity remain separately validated.",
  "oneOf": [
    {
      "$ref": "#/$defs/public_packet"
    },
    {
      "$ref": "#/$defs/truth_packet"
    },
    {
      "$ref": "#/$defs/public_review"
    },
    {
      "$ref": "#/$defs/freeze"
    },
    {
      "$ref": "#/$defs/release"
    },
    {
      "$ref": "#/$defs/truth_review"
    },
    {
      "$ref": "#/$defs/adjudication"
    },
    {
      "$ref": "#/$defs/later_critique"
    }
  ],
  "$defs": {
    "hash": {
      "type": "string",
      "pattern": "^[0-9a-f]{64}$"
    },
    "id": {
      "type": "string",
      "minLength": 1
    },
    "span": {
      "type": "object",
      "properties": {
        "start": {
          "type": "integer",
          "minimum": 0
        },
        "end": {
          "type": "integer",
          "minimum": 0
        },
        "quote": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "start",
        "end",
        "quote"
      ],
      "additionalProperties": false
    },
    "context_span": {
      "type": "object",
      "properties": {
        "start": {
          "type": "integer",
          "minimum": 0
        },
        "end": {
          "type": "integer",
          "minimum": 0
        }
      },
      "required": [
        "start",
        "end"
      ],
      "additionalProperties": false
    },
    "reviewer": {
      "type": "object",
      "properties": {
        "id": {
          "type": "string",
          "minLength": 1
        },
        "kind": {
          "type": "string",
          "enum": [
            "human",
            "agent"
          ]
        },
        "expertise": {
          "type": "string",
          "minLength": 1
        },
        "conflicts": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "identity_attestation_ref": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "id",
        "kind",
        "expertise",
        "conflicts",
        "identity_attestation_ref"
      ],
      "additionalProperties": false
    },
    "asset_ref": {
      "type": "object",
      "properties": {
        "campaign_id": {
          "type": "string",
          "minLength": 1
        },
        "artifact_id": {
          "type": "string",
          "minLength": 1
        },
        "manifest_hash": {
          "type": "string",
          "pattern": "^[0-9a-f]{64}$"
        },
        "raw_sha256": {
          "type": "string",
          "pattern": "^[0-9a-f]{64}$"
        },
        "bytes": {
          "type": "integer",
          "minimum": 0
        },
        "producer_source_id": {
          "type": "string",
          "minLength": 1
        },
        "source_revision": {
          "type": "integer",
          "minimum": 0
        },
        "available_revision": {
          "type": "integer",
          "minimum": 0
        }
      },
      "required": [
        "campaign_id",
        "artifact_id",
        "manifest_hash",
        "raw_sha256",
        "bytes",
        "producer_source_id",
        "source_revision",
        "available_revision"
      ],
      "additionalProperties": false
    },
    "source": {
      "type": "object",
      "properties": {
        "id": {
          "type": "string",
          "minLength": 1
        },
        "kind": {
          "type": "string",
          "enum": [
            "authored_prose",
            "authored_code",
            "public_contract",
            "observation",
            "execution_output",
            "operational_record",
            "artifact_manifest",
            "asset_inspection",
            "private_truth"
          ]
        },
        "visibility": {
          "type": "string",
          "enum": [
            "actor_public",
            "reviewer_public",
            "private_truth"
          ]
        },
        "text": {
          "type": "string"
        },
        "text_utf8_sha256": {
          "type": "string",
          "pattern": "^[0-9a-f]{64}$"
        },
        "origin": {
          "type": "string",
          "enum": [
            "authored",
            "generated",
            "provided"
          ]
        },
        "event_revision": {
          "anyOf": [
            {
              "type": "integer",
              "minimum": 0
            },
            {
              "type": "null"
            }
          ]
        },
        "available_revision": {
          "anyOf": [
            {
              "type": "integer",
              "minimum": 0
            },
            {
              "type": "null"
            }
          ]
        },
        "authoring_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1
            },
            {
              "type": "null"
            }
          ]
        },
        "actor_cutoff": {
          "anyOf": [
            {
              "type": "integer",
              "minimum": 0
            },
            {
              "type": "null"
            }
          ]
        },
        "provenance_ref": {
          "type": "string",
          "minLength": 1
        },
        "operation_kind": {
          "type": "string",
          "enum": [
            "query",
            "analysis",
            "stop",
            "prepare",
            "predict",
            "system"
          ]
        },
        "asset_ref": {
          "anyOf": [
            {
              "$ref": "#/$defs/asset_ref"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "id",
        "kind",
        "visibility",
        "text",
        "text_utf8_sha256",
        "origin",
        "event_revision",
        "available_revision",
        "authoring_id",
        "actor_cutoff",
        "provenance_ref",
        "operation_kind",
        "asset_ref"
      ],
      "additionalProperties": false
    },
    "target": {
      "type": "object",
      "properties": {
        "id": {
          "type": "string",
          "minLength": 1
        },
        "source_id": {
          "type": "string",
          "minLength": 1
        },
        "span": {
          "$ref": "#/$defs/span"
        },
        "context_span": {
          "$ref": "#/$defs/context_span"
        },
        "actor_cutoff": {
          "anyOf": [
            {
              "type": "integer",
              "minimum": 0
            },
            {
              "type": "null"
            }
          ]
        },
        "endorsement_source_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1
            },
            {
              "type": "null"
            }
          ]
        },
        "kind": {
          "type": "string",
          "enum": [
            "physical_assertion",
            "working_assumption",
            "conditional_result",
            "static_code_behavior",
            "observed_result",
            "prospective_commitment",
            "ambiguous"
          ]
        },
        "force": {
          "type": "string",
          "enum": [
            "asserted",
            "conjectured",
            "stipulated",
            "conditional",
            "intended",
            "recorded",
            "ambiguous"
          ]
        },
        "proposition": {
          "type": "string",
          "minLength": 1
        },
        "endpoint": {
          "type": "string",
          "enum": [
            "scientific_conclusion",
            "predictor_fidelity",
            "code_computation",
            "operational_delivery"
          ]
        }
      },
      "required": [
        "id",
        "source_id",
        "span",
        "context_span",
        "actor_cutoff",
        "endorsement_source_id",
        "kind",
        "force",
        "proposition",
        "endpoint"
      ],
      "additionalProperties": false
    },
    "public_packet": {
      "type": "object",
      "properties": {
        "document_type": {
          "const": "claim-review-v5-public-packet-v1.0"
        },
        "campaign_id": {
          "type": "string",
          "minLength": 1
        },
        "instrument_version": {
          "type": "string",
          "minLength": 1
        },
        "review_asof_revision": {
          "type": "integer",
          "minimum": 0
        },
        "scientific_stop_revision": {
          "anyOf": [
            {
              "type": "integer",
              "minimum": 0
            },
            {
              "type": "null"
            }
          ]
        },
        "sources": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/source"
          }
        },
        "targets": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/target"
          }
        },
        "required_target_ids": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "required_code_source_ids": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "scientific_decision_target_ids": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "presentation_mode": {
          "type": "string",
          "enum": [
            "actor_cutoff",
            "retrospective_public"
          ]
        },
        "frame_cutoff": {
          "anyOf": [
            {
              "type": "integer",
              "minimum": 0
            },
            {
              "type": "null"
            }
          ]
        },
        "selection_rule": {
          "type": "string",
          "minLength": 1
        },
        "unreviewed_scope": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        }
      },
      "required": [
        "document_type",
        "campaign_id",
        "instrument_version",
        "review_asof_revision",
        "scientific_stop_revision",
        "sources",
        "targets",
        "required_target_ids",
        "required_code_source_ids",
        "scientific_decision_target_ids",
        "presentation_mode",
        "frame_cutoff",
        "selection_rule",
        "unreviewed_scope"
      ],
      "additionalProperties": false
    },
    "truth_packet": {
      "type": "object",
      "properties": {
        "document_type": {
          "const": "claim-review-v5-truth-packet-v1.0"
