        "interpretation": {
          "type": "object",
          "properties": {
            "kind": {
              "type": "string",
              "enum": [
                "physical_assertion",
                "working_assumption",
                "conditional_result",
                "static_code_behavior",
                "observed_result",
                "prospective_commitment",
                "ambiguous"
              ]
            },
            "force": {
              "type": "string",
              "enum": [
                "asserted",
                "conjectured",
                "stipulated",
                "conditional",
                "intended",
                "recorded",
                "ambiguous"
              ]
