schema_version: 2
registration_status: registered
experiment_id: exp_001
created_at: '2026-10-29T19:35:01+00:00'
plan:
  question: Does price-only OLS fitted to this prescribed design recover the intervention
    means and best listed price?
  hypothesis: Price-only OLS recovers population intervention means (RMSE <= 1e-10)
    and selects a zero-regret listed price.
  scope: Noiseless balanced-Z synthetic population; finite prices30/40; one fixed
    analysis per design.
  assumptions: UniformZ, affine mean model, fixed sampling/assignment; no statistical
    uncertainty or real-market validity implied.
  data_access: This arm's training price/demand and evaluation price/population features.
    Evaluation labels and generator are not staged. Owner and public reader know the
    generator.
  stopping_rule: One fit and one supervisor evaluation; no tuning or replacement.
  action: hypothesis_test
  confirmatory_status: exploratory
  scientist_information_mode: black_box_v2
  predictions:
  - id: mean_recovery
    metric: mean_demand_rmse
    operator: <=
    threshold: 1.0e-10
  - id: optimal_listed_price
    metric: regret
    operator: <=
    threshold: 1.0e-10
validation_suite:
  status: ready
  metrics:
  - name: mean_demand_rmse
    role: primary
    direction: minimize
    weight: 1.0
    normalization:
      type: minmax
      min: 0.0
      max: 40.0
    computation:
      kind: rmse
      truth: data/1/eval.csv
      key: id
      target: mean_demand
      prediction: predicted_mean_demand
  - name: policy_value
    role: diagnostic
    direction: maximize
    computation:
      kind: policy_value
      truth: data/1/eval.csv
      key: id
      target: expected_revenue
      prediction: predicted_revenue
      group_by: &id001
      - population
      action: price
      objective: maximize
      tie_break: lowest_action
      value_semantics: expected_interventional
    weight: 0.0
    normalization:
      type: identity
  - name: regret
    role: diagnostic
    direction: minimize
    computation:
      kind: regret
      truth: data/1/eval.csv
      key: id
      target: expected_revenue
      prediction: predicted_revenue
      group_by: *id001
      action: price
      objective: maximize
      tie_break: lowest_action
      value_semantics: expected_interventional
    weight: 0.0
    normalization:
      type: identity
  schema_version: 1
data_manifest:
  status: ready
  datasets:
  - path: data/raw/train.csv
    role: training
    provenance: Synthetic noiseless analytic world; see the published generator and
      protocol. Eight training units; evaluation rows are population means, not sampled
      individuals.
    generator: data/generate.py
    generator_args:
    - --kind
    - randomized
    - --seed
    - '42'
    - --output
    - output.csv
    generated_output: output.csv
    seed: 42
  - path: data/raw/eval.csv
    role: evaluation
    provenance: Synthetic noiseless analytic world; see the published generator and
      protocol. Eight training units; evaluation rows are population means, not sampled
      individuals.
    generator: data/generate.py
    generator_args:
    - --kind
    - evaluation
    - --seed
    - '42'
    - --output
    - output.csv
    generated_output: output.csv
    seed: 42
    input_columns:
    - id
    - population
    - price
