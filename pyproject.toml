[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sciquest"
version = "0.2.0"
description = "Agent-operable autonomous research framework for iterative scientific quests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SciQuest contributors"}]
keywords = ["research", "agents", "jupyter", "science", "automation"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = [
  "typer>=0.9",
  "PyYAML>=6.0",
  "nbformat>=5.9",
  "nbclient>=0.8",
  "ipykernel>=6.0",
  "rich>=13.0",
  "packaging>=22",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
papermill = ["papermill>=2.5"]
science = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
example = ["matplotlib>=3.9,<4"]

[project.scripts]
sciquest = "sciquest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sciquest"]
artifacts = ["src/sciquest/methods/profiles/*.yaml", "src/sciquest/vendor/mathjax/*.js"]

[tool.hatch.build.targets.sdist]
include = ["src/sciquest", "tests", "scripts", "examples", "docs/examples", "README.md", "AGENTS.md", "LICENSE"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
